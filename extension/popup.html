<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DSA Tracker Pro Pairing</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
    }
    h2 {
      font-size: 15px;
      margin: 0 0 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #38bdf8;
    }
    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    .badge-paired { background-color: #065f46; color: #34d399; }
    .badge-unpaired { background-color: #475569; color: #cbd5e1; }
    .badge-repair { background-color: #881337; color: #fb7185; }
    label {
      font-size: 12px;
      color: #94a3b8;
      display: block;
      margin-bottom: 4px;
    }
    input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      border: 1px solid #334155;
      background-color: #1e293b;
      color: #fff;
      border-radius: 6px;
      font-size: 12px;
      font-family: monospace;
      margin-bottom: 10px;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: #38bdf8;
    }
    button {
      width: 100%;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      margin-bottom: 8px;
    }
    .btn-primary {
      background-color: #0284c7;
      color: #ffffff;
    }
    .btn-primary:hover { background-color: #0369a1; }
    .btn-danger {
      background-color: #ef4444;
      color: #ffffff;
    }
    .btn-danger:hover { background-color: #dc2626; }
    .status-box {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 11px;
      color: #94a3b8;
      margin-top: 10px;
      line-height: 1.4;
    }
    .status-box strong { color: #f8fafc; }
    .error-msg {
      color: #f87171;
      font-size: 11px;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <h2>DSA Tracker Pro Sync</h2>
  <div id="statusBadge" class="badge badge-unpaired">Checking status...</div>

  <div id="pairingForm">
    <label for="tokenInput">Pairing Token (from Web App):</label>
    <input type="text" id="tokenInput" placeholder="dsat_..." autocomplete="off" />
    <button id="pairBtn" class="btn-primary">Pair Extension</button>
  </div>

  <div id="pairedControls" style="display: none;">
    <button id="unpairBtn" class="btn-danger">Unpair Device</button>
  </div>

  <div class="status-box">
    <div><strong>Last Sync:</strong> <span id="lastSyncTime">Never</span></div>
    <div id="errorMessage" class="error-msg"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
