runtime: nodejs20

env: standard

service: frontend

handlers:
  - url: .*
    script: auto

env_variables:
  NODE_ENV: "production"
  PORT: "8080"

automatic_scaling:
  min_instances: 1
  max_instances: 10
  target_cpu_utilization: 0.65
  target_throughput_utilization: 0.65

vpc_access_connector:
  name: projects/PROJECT_ID/locations/REGION/connectors/dsa-connector

# Health check configuration
health_check:
  enable_health_check: true
  check_interval_sec: 40
  timeout_sec: 4
  healthy_threshold: 2
  unhealthy_threshold: 2
  path: /
