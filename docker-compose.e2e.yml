name: dsa-tracker-e2e

services:
  db-test:
    image: postgres:15-alpine
    restart: "no"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: dsatracker_test
    ports:
      - "${E2E_DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dsatracker_test"]
      interval: 3s
      timeout: 3s
      retries: 10

