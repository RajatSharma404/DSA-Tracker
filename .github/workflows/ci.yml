name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-qa:
    name: Backend QA (Types & Tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check (tsc)
        run: npx tsc --noEmit

      - name: Run Vitest test suite
        run: npm test
        env:
          NODE_ENV: test
          COOKIE_ENCRYPTION_KEY: test-encryption-key-for-ci-pipeline-32b
          JWT_SECRET: test-jwt-secret-for-ci-pipeline

  frontend-qa:
    name: Frontend QA (Lint, Types & Tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Next.js bundle
        uses: actions/cache@v4
        with:
          path: |
            frontend/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('frontend/src/**/*.[jt]s', 'frontend/src/**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint check (eslint)
        run: npm run lint

      - name: Type check (tsc)
        run: npx tsc --noEmit

      - name: Run frontend unit & component tests
        run: npm test -- --run
        env:
          NEXTAUTH_SECRET: test-nextauth-secret-for-ci

  security-and-manifest-audit:
    name: Security & Extension Permissions Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Chrome Extension Least-Privilege Permissions
        run: |
          echo "Auditing extension/manifest.json host permissions..."
          if grep -q '"https://\*/\*"' extension/manifest.json; then
            echo "ERROR: Wildcard 'https://*/*' host permission detected in extension/manifest.json!"
            exit 1
          fi
          echo "Verified: No wildcard permissions found."

      - name: Verify Prisma Schema Synchronization
        run: |
          echo "Verifying backend and frontend Prisma schema synchronization..."
          if ! cmp -s backend/prisma/schema.prisma frontend/prisma/schema.prisma; then
            echo "ERROR: backend/prisma/schema.prisma and frontend/prisma/schema.prisma are out of sync!"
            echo "Run 'npm run sync:prisma' to synchronize schemas."
            exit 1
          fi
          echo "Verified: Backend and frontend Prisma schemas are synchronized."
