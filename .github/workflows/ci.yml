name: CI Pipeline

on:
  push:
    branches: [main, master, "upgrade/**"]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-qa:
    name: Backend QA (Types, Tests & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check (tsc)
        run: npx tsc --noEmit

      - name: Run Vitest test suite
        run: npm test
        env:
          NODE_ENV: test
          COOKIE_ENCRYPTION_KEY: test-encryption-key-for-ci-pipeline-32b
          JWT_SECRET: test-jwt-secret-for-ci-pipeline

      - name: Build backend application
        run: npm run build

  frontend-qa:
    name: Frontend QA (Lint, Types, Tests & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Next.js bundle
        uses: actions/cache@v4
        with:
          path: |
            frontend/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('frontend/src/**/*.[jt]s', 'frontend/src/**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint check (eslint)
        run: npm run lint

      - name: Type check (tsc)
        run: npx tsc --noEmit

      - name: Run frontend unit & component tests
        run: npm test -- --run
        env:
          NEXTAUTH_SECRET: test-nextauth-secret-for-ci

      - name: Build frontend application
        run: npm run build
        env:
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: test-nextauth-secret-for-ci
          NEXT_PUBLIC_API_URL: http://localhost:5000/api

  repo-checks:
    name: Security, Extension Audit & Schema Parity
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dsatracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend dependencies & generate Prisma
        working-directory: ./backend
        run: |
          npm ci
          npx prisma generate
          npx prisma db push
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dsatracker_test?schema=public

      - name: Verify Chrome Extension Least-Privilege Permissions
        run: |
          echo "Auditing extension/manifest.json host permissions..."
          if grep -q '"https://\*/\*"' extension/manifest.json; then
            echo "ERROR: Wildcard 'https://*/*' host permission detected in extension/manifest.json!"
            exit 1
          fi
          echo "Verified: No wildcard permissions found."

      - name: Verify Prisma Schema Synchronization
        run: node scripts/check-schema-sync.mjs

      - name: Verify ERD Documentation Freshness
        run: node scripts/check-erd-freshness.mjs

      - name: Validate Mermaid Architecture Diagrams
        run: node scripts/validate-mermaid.mjs

      - name: Verify Extension Contract Parity & Checksum
        run: node scripts/validate-extension-payload.mjs

      - name: Verify Zero Migration Drift (prisma migrate diff)
        working-directory: ./backend
        run: |
          npx prisma migrate diff \
            --from-schema-datasource prisma/schema.prisma \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dsatracker_test?schema=public
